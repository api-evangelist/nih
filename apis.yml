apis:
- name: NCBI E-utilities (Entrez Programming Utilities)
  description: >-
    The public API to the NCBI Entrez system providing programmatic access to all Entrez databases including
    PubMed, PMC, Gene, Nuccore, and Protein. Supports searching, fetching, linking, and summarizing records
    across 38+ databases.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.ncbi.nlm.nih.gov/home/develop/api/
  baseURL: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
  tags:
  - PubMed
  - Literature
  - Genomics
  - Entrez
  properties:
  - type: Documentation
    url: https://www.ncbi.nlm.nih.gov/books/NBK25500/
  contact:
  - FN: NCBI
    email: info@ncbi.nlm.nih.gov
- name: PubChem Power User Gateway (PUG REST)
  description: >-
    Suite of REST APIs providing programmatic access to PubChem chemical compound data, including chemical
    structure searches, compound properties, biological assay data, and chemical standardization for millions
    of compounds.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://pubchem.ncbi.nlm.nih.gov/docs/programmatic-access
  baseURL: https://pubchem.ncbi.nlm.nih.gov/rest/pug/
  tags:
  - Chemistry
  - Chemical Data
  - PubChem
  - Compounds
  - Bioassay
  properties:
  - type: Documentation
    url: https://pubchem.ncbi.nlm.nih.gov/docs/programmatic-access
  - type: Documentation
    url: https://pubchem.ncbi.nlm.nih.gov/pug_rest/PUG_REST.html
  contact:
  - FN: PubChem
    url: https://pubchemdocs.ncbi.nlm.nih.gov/contact
- name: NIH RePORTER API
  description: >-
    REST API providing programmatic access to NIH-funded research project data including grants, contracts,
    publications, and patents. Enables search and retrieval of funding records with extensive filtering
    by institute, mechanism, fiscal year, and keywords.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://reporter.nih.gov/
  baseURL: https://api.reporter.nih.gov/v2/
  tags:
  - Research Funding
  - Grants
  - Publications
  - NIH Projects
  properties:
  - type: Documentation
    url: https://api.reporter.nih.gov/
  contact:
  - FN: NIH RePORTER
    url: https://reporter.nih.gov/
- name: NCBI BLAST URL API
  description: >-
    API enabling developers to submit BLAST (Basic Local Alignment Search Tool) sequence searches via
    HTTPS for processing at NCBI or cloud service providers, check job status, and retrieve results in
    multiple formats for sequence similarity analysis.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://blast.ncbi.nlm.nih.gov/Blast.cgi?CMD=Web&PAGE_TYPE=BlastDocs&DOC_TYPE=DeveloperInfo
  baseURL: https://blast.ncbi.nlm.nih.gov/blast/Blast.cgi
  tags:
  - BLAST
  - Sequence Alignment
  - Genomics
  - Bioinformatics
  properties:
  - type: Documentation
    url: https://ncbi.github.io/blast-cloud/dev/api.html
  contact:
  - FN: NCBI
    email: info@ncbi.nlm.nih.gov
- name: PubMed Central (PMC) OA API
  description: >-
    APIs for programmatic access to PubMed Central's Open Access content, including file validation, Open
    Access service, and an ID converter for translating between PMCID, PMID, Manuscript ID, and DOI identifiers.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://pmc.ncbi.nlm.nih.gov/tools/developers/
  baseURL: https://www.ncbi.nlm.nih.gov/pmc/
  tags:
  - PubMed Central
  - Open Access
  - Publications
  - Literature
  properties:
  - type: Documentation
    url: https://pmc.ncbi.nlm.nih.gov/tools/developers/
  contact:
  - FN: PMC
    url: https://pmc.ncbi.nlm.nih.gov/
